[project]
name = "quicklearn-local"
version = "0.1.0b2"
description = "AINotes: local AI learning notes, courses and quizzes for Apple Silicon Mac"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20",
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "markitdown[docx,pptx,pdf]>=0.1",
  "pymupdf>=1.25", "python-pptx>=1.0", "python-docx>=1.1",
  "trafilatura>=2", "yt-dlp>=2026.3", "pillow>=11", "pytest>=8", "beautifulsoup4>=4.13",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"
]
[project.urls]
Repository = "https://github.com/zhuxinleibandou/AINotes"
Issues = "https://github.com/zhuxinleibandou/AINotes/issues"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
